[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apex"
version = "0.1.0"
description = "Project APEX: standalone quantitative research and trading platform (research/paper only)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pandas>=2.1",
  "numpy>=1.26",
  "httpx>=0.27",
  "fastapi>=0.110",
  "pypdf>=4.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3.9"]
server = ["uvicorn>=0.29"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
apex = "apex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apex = ["migrations/*.py", "migrations/versions/*.py", "migrations/*.mako", "api/static/*", "api/static/brand/*", "api/static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "UP042"]  # Depends() in defaults is idiomatic FastAPI; str+Enum kept for clarity

[tool.ruff.lint.per-file-ignores]
"src/apex/migrations/versions/*" = ["E501", "I001", "W291"]
"tests/*" = ["E501"]
