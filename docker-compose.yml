# Local/VPS stack: PostgreSQL 16 with pgvector + APEX API.
# Built and started on every CI run (the `docker` job checks /health and /ui/).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: ${APEX_DB_PASSWORD:?set APEX_DB_PASSWORD in .env}
      POSTGRES_DB: apex
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  api:
    build: .
    environment:
      APEX_DATABASE_URL: postgresql+psycopg://apex:${APEX_DB_PASSWORD}@db:5432/apex
      APEX_TRADING_MODE: research
      APEX_LOG_JSON: "true"
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      retries: 30
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
