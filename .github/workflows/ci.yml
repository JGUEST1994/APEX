name: ci
on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the code; the GitHub token gets no write access.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex
          POSTGRES_DB: apex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apex -d apex_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APEX_TEST_POSTGRES_URL: postgresql+psycopg://apex:apex@localhost:5432/apex_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,postgres,server]"
      - run: ruff check src tests
      - run: pytest

  test-windows:
    # Jake runs APEX on Windows; GitHub's Windows runners have no PostgreSQL service,
    # so this job runs the suite on SQLite only (the PostgreSQL tests skip themselves)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,server]"
      - run: pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # resolves the project's runtime dependencies in an isolated env and checks them
      # against the PyPI/OSV advisory databases; fails the build on any known vulnerability
      - run: pip-audit --progress-spinner off .

  docker:
    # builds the image and starts the docker-compose stack (PostgreSQL + API), then checks
    # that migrations ran, /health sees the database in research mode and /ui/ is served
    runs-on: ubuntu-latest
    env:
      APEX_DB_PASSWORD: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: |
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/health | tee health.json
          grep -q '"database":true' health.json
          grep -q '"trading_mode":"research"' health.json
          grep -q '"live_trading_available":false' health.json
          curl -sf -o /dev/null http://127.0.0.1:8000/ui/
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
