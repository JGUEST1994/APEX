name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex
          POSTGRES_DB: apex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apex" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APEX_TEST_POSTGRES_URL: postgresql+psycopg://apex:apex@localhost:5432/apex_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,postgres,server]"
      - run: ruff check src tests
      - run: pytest
